# Ansible settings for the lab. Run from infra/ansible (the Makefile targets do this).
[defaults]
inventory = inventory/hosts.ini
remote_user = ubuntu
private_key_file = ~/.ssh/kubeguard-lab
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
result_format = yaml
deprecation_warnings = False
remote_tmp = /tmp/.ansible-tmp

[ssh_connection]
pipelining = True
ssh_args = -o IdentitiesOnly=yes -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
