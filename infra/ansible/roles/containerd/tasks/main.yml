# Role containerd: the container runtime (containerd), its low-level runner (runc) and the
# crictl command. Installed from the projects' release files, verified against pinned SHA256
# hashes. No CNI plugin is installed: Cilium provides pod networking (P1-U5).

- name: Create the directories containerd and the CNI expect
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containerd
    - /opt/cni/bin
    - /etc/cni/net.d

# --- containerd ---
- name: Read the installed containerd version
  ansible.builtin.command: /usr/local/bin/containerd --version
  register: containerd_installed
  failed_when: false
  changed_when: false

- name: Download containerd
  ansible.builtin.get_url:
    url: "{{ containerd_url }}"
    dest: "/var/tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ containerd_sha256 }}"
    mode: "0644"
  when: containerd_version not in containerd_installed.stdout

- name: Install containerd into /usr/local
  ansible.builtin.unarchive:
    src: "/var/tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: true
  when: containerd_version not in containerd_installed.stdout
  notify: Restart containerd

# --- runc ---
- name: Install runc
  ansible.builtin.get_url:
    url: "{{ runc_url }}"
    dest: /usr/local/sbin/runc
    checksum: "sha256:{{ runc_sha256 }}"
    owner: root
    group: root
    mode: "0755"

# --- crictl ---
- name: Read the installed crictl version
  ansible.builtin.command: /usr/local/bin/crictl --version
  register: crictl_installed
  failed_when: false
  changed_when: false

- name: Download crictl
  ansible.builtin.get_url:
    url: "{{ crictl_url }}"
    dest: "/var/tmp/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ crictl_sha256 }}"
    mode: "0644"
  when: crictl_version not in crictl_installed.stdout

- name: Install crictl into /usr/local/bin
  ansible.builtin.unarchive:
    src: "/var/tmp/crictl-{{ crictl_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
  when: crictl_version not in crictl_installed.stdout

# --- configuration and service ---
- name: Write the containerd configuration (systemd cgroup driver)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Write the containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart containerd

- name: Point crictl at the containerd socket
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
    owner: root
    group: root
    mode: "0644"

- name: Apply unit and configuration changes before starting
  ansible.builtin.meta: flush_handlers

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

# --- checks: the role fails if the node is not in the intended state ---
- name: Check the installed versions
  ansible.builtin.shell: |
    c=$(/usr/local/bin/containerd --version)
    r=$(/usr/local/sbin/runc --version)
    t=$(/usr/local/bin/crictl --version)
    [[ "$c" == *"v{{ containerd_version }}"* && "$r" == *"{{ runc_version }}"* && "$t" == *"{{ crictl_version }}"* ]]
  args:
    executable: /bin/bash
  changed_when: false

- name: Check that containerd uses the systemd cgroup driver
  ansible.builtin.shell: |
    d=$(/usr/local/bin/containerd config dump)
    [[ "$d" == *"SystemdCgroup = true"* ]]
  args:
    executable: /bin/bash
  changed_when: false

- name: Check that the runtime is ready (crictl info)
  ansible.builtin.shell: |
    i=$(/usr/local/bin/crictl info)
    jq -r '.status.conditions[] | select(.type=="RuntimeReady") | .status' <<<"$i"
  args:
    executable: /bin/bash
  register: containerd_ready
  changed_when: false
  failed_when: containerd_ready.stdout != "true"
