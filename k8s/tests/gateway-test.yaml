# P1-U6 check, layer 7: a Gateway gets an address from the pool and routes a path to lb-test.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: gw-test, namespace: default}
spec:
  gatewayClassName: cilium
  listeners:
    - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: route-test, namespace: default}
spec:
  parentRefs: [{name: gw-test}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: lb-test, port: 80}]
