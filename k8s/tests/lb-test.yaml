# P1-U6 check, layer 4: a LoadBalancer Service must receive an address from the pool and answer.
apiVersion: apps/v1
kind: Deployment
metadata: {name: lb-test, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: lb-test}}
  template:
    metadata: {labels: {app: lb-test}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: lb-test, namespace: default}
spec:
  type: LoadBalancer
  selector: {app: lb-test}
  ports: [{port: 80, targetPort: 80}]
