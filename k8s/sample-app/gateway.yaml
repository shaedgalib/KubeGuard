# Layer 7 entry for the sample app. The Gateway gets its address from the pool (ADR-003, ADR-004).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: sample-gw, namespace: sample}
spec:
  gatewayClassName: cilium
  listeners:
    - {name: http, protocol: HTTP, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: sample-route, namespace: sample}
spec:
  parentRefs: [{name: sample-gw}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: frontend, port: 80}]
