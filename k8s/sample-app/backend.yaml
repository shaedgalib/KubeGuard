# Tier 2: a static page served by nginx. Only the frontend talks to it.
apiVersion: v1
kind: ConfigMap
metadata: {name: backend-page, namespace: sample}
data:
  index.html: "backend ok\n"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: sample}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend, tier: backend}}
    spec:
      automountServiceAccountToken: false   # the app never calls the API (CIS 5.1.6)
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Non-root nginx on port 8080: the sample namespace enforces Pod Security "restricted" (P2-U4).
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          # CPU and memory limits are required by the Kyverno policy require-resource-limits (P2-U7).
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: page
          configMap: {name: backend-page}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: sample}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 8080}]
