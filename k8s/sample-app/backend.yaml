# Tier 2: a static page served by nginx. Only the frontend talks to it.
apiVersion: v1
kind: ConfigMap
metadata: {name: backend-page, namespace: sample}
data:
  index.html: "backend ok\n"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: sample}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend, tier: backend}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts: [{name: page, mountPath: /usr/share/nginx/html}]
      volumes:
        - name: page
          configMap: {name: backend-page}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: sample}
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
