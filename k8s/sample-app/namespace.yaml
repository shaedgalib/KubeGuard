# P1-U8 sample application: a small two-tier web app used to prove the path
# host -> Gateway (Envoy) -> frontend -> backend and to see its flows in Hubble.
apiVersion: v1
kind: Namespace
metadata:
  name: sample
---
# The default service account is not used by the sample app and needs no API token (P2-U3, CIS 5.1.5 and 5.1.6).
apiVersion: v1
kind: ServiceAccount
metadata: {name: default, namespace: sample}
automountServiceAccountToken: false
