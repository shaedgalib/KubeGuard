# Tier 1: nginx. "/" answers itself; "/api" is passed on to the backend Service.
apiVersion: v1
kind: ConfigMap
metadata: {name: frontend-conf, namespace: sample}
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        default_type text/plain;
        return 200 "frontend ok\n";
      }
      location /api {
        proxy_pass http://backend.sample.svc.cluster.local:80/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: sample}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, tier: frontend}}
    spec:
      automountServiceAccountToken: false   # the app never calls the API (CIS 5.1.6)
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: nginx
          # Non-root nginx on port 8080: the sample namespace enforces Pod Security "restricted" (P2-U4).
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          # CPU and memory limits are required by the Kyverno policy require-resource-limits (P2-U7).
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap: {name: frontend-conf}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: sample}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
