# P2-U4: Pod Security Admission levels per namespace (decision H4). Applied by infra/access/pod-security.sh.
# Columns: namespace, enforce, audit, warn. A "-" in the warn column means no warn label.
#
# restricted  workload namespaces. The sample app complies (non-root, no privilege escalation, all capabilities
#             dropped, runtime default seccomp profile). kyverno complies by its chart defaults.
# baseline    default: the P1 test pods run here, and a pod created without a namespace lands here. Nothing
#             privileged, with host namespaces or with hostPath volumes can run.
# privileged  system namespaces, documented exemptions: kube-system and cilium-secrets (control plane, Cilium),
#             local-path-storage (its helper pods mount host paths), monitoring (node-exporter needs the host
#             namespaces and host paths), scanners (kube-bench needs hostPID and host paths).
# Every namespace also has audit=restricted, so the API audit log records what would not pass restricted.
sample              restricted  restricted  restricted
kyverno             restricted  restricted  restricted
default             baseline    restricted  restricted
kube-public         restricted  restricted  -
kube-node-lease     restricted  restricted  -
kube-system         privileged  restricted  -
cilium-secrets      privileged  restricted  -
local-path-storage  privileged  restricted  -
monitoring          privileged  restricted  -
scanners            privileged  restricted  -
